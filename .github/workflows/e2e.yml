name: E2E (Playwright)

# Manual run pehle green ho gaya (run 40553212498, 27 Oct 2026), isliye ab
# push par bhi chalta hai (plan T4 ka rule pura hua).
#
# DB writes ka niyam: `E2E_ALLOW_WRITES` sirf MANUAL run par lagta hai.
# Push par wo hamesha khaali jaata hai -> job-create/direct-sale skip ->
# koi bhi commit galti se prod/staging DB me rows nahi bana sakta.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Verify e2e secrets
        # ci.yml jaisa fail-fast: missing secret = GitHub empty string deta hai,
        # warna error "supabaseUrl is required" jaisa confusing aata hai.
        # Values kabhi print nahi hoti.
        #
        # ZAROORI: `run:` step ko `secrets.*` apne aap nahi milte — `env:` se
        # pass karna padta hai. Pehle yahan env block missing tha, isliye loop
        # ko hamesha paanchon khaali milte the aur error galat tarike se
        # "saare secrets missing" dikhata tha (secret maujood hone par bhi).
        run: |
          missing=""
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                   SUPABASE_SERVICE_ROLE_KEY E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            eval "val=\${$v}"
            if [ -z "$val" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            {
              echo "::error title=Missing e2e secrets::Ye repository secrets missing hain:$missing"
              echo "::error::Repo → Settings → Secrets and variables → Actions → tab 'Secrets' (Variables/Environments nahi) → New repository secret."
            }
            exit 1
          fi
          echo "all e2e secrets present"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Run smoke tests
        # Write specs (job/direct-sale) tabhi chalti hain jab repo variable
        # E2E_ALLOW_WRITES=1 ho — taaki galti se prod DB me rows na banein.
        # Push par hamesha khaali: sirf read-only specs, DB bilkul chhui nahi
        # jaati. Poora write-suite sirf manual dispatch par.
        run: npm run e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ALLOW_WRITES: ${{ github.event_name == 'workflow_dispatch' && vars.E2E_ALLOW_WRITES || '' }}

      - name: Upload Playwright report
        # v7 = Node 24 runtime (v4 ka Node 20 deprecated tha). Report failure
        # par hi chahiye, isliye `if: failure()`. v7 ka upload ek green run par
        # verify ho chuka hai (run 40554702080, artifact 202 KB).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
