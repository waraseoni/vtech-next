name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Actions UI se manually chalane ke liye — bina dummy commit ke.
  # (Jaise abhi secrets add karke seedha verify karna.)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format:check

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build secrets
        # Missing repo secret = GitHub empty string substitute karta hai, aur
        # error "supabaseUrl is required" jaisa confusing aata hai (page-data
        # collection ke beech). Yahan pehle hi saaf bata dete hain.
        # Sirf emptiness check — value kabhi print/echo nahi hoti.
        run: |
          missing=""
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            eval "val=\${$v}"
            if [ -z "$val" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            {
              echo "::error title=Missing GitHub Actions secrets::Build ko ye secrets chahiye par ye repo me set nahi hain:$missing"
              echo "::error::Add karo: GitHub → repo → Settings → Secrets and variables → Actions → New repository secret (har naam ke liye)."
            }
            exit 1
          fi
          echo "all build secrets present"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build
        # GH `run:` steps bash -e ke saath chalte hain — failing pipeline
        # seedha script exit kar deta hai, isliye `|| code=$?` se error
        # capture karte hain (errexit ko check karta hua command chhodta hai).
        run: |
          set -o pipefail
          code=0
          npm run build 2>&1 | tee build.log || code=$?
          if [ "$code" -ne 0 ]; then
            # Actions logs download API admin-only (403/401), par check-runs
            # annotations bina auth ke milti hain — isliye tail yahan daalte hain.
            # % se shuru hone wale chars + CR/LF ko escape karo warna GitHub
            # workflow command ka format toot jayega.
            tail -n 60 build.log \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk 'BEGIN{ORS=""} {printf "%s%%0A", $0}' > annot.txt
            printf '::error title=next build failed (exit %s)::%s\n' \
              "$code" "$(cat annot.txt)"
            exit "$code"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: build.log
          if-no-files-found: ignore
